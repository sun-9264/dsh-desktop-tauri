[package]
name = "dsh-desktop"
version = "0.1.1"
description = "DSH Desktop — DeepSeek Harness 第三方桌面启动器（Tauri 版，非官方）"
license = "MIT"
repository = "https://github.com/sun-9264/dsh-desktop-tauri"
authors = ["sun-9264"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
junction = "1"
